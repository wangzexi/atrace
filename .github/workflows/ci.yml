name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            client/app/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Build and test the web client
        working-directory: client/web
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run unused
      - name: Test and build the server
        working-directory: server
        run: |
          go vet ./...
          go test ./...
          mkdir -p build
          CGO_ENABLED=0 go build -trimpath -o build/atrace-server .
      - name: Test the app and collectors
        run: |
          (cd client/app && go test ./...)
          bun test client/app/tests/collectors client/app/tests/package-update.test.mjs
      - name: Exercise the browser
        working-directory: client/web
        run: |
          bunx --bun playwright install --with-deps chromium
          export ATRACE_TEST_REPORTS="$(mktemp -d)"
          export ATRACE_TEST_PORT="$(bun -e 'const s=require("node:net").createServer();s.listen(0,"127.0.0.1",()=>{console.log(s.address().port);s.close()})')"
          bunx --bun playwright test
      - name: Upload verified server files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-server
          path: |
            server/build/atrace-server
            client/web/build/
          if-no-files-found: error
          retention-days: 2

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-server
          path: verified
      - name: Publish the verified server image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          mkdir -p image
          install -m 0755 verified/server/build/atrace-server image/atrace-server
          cp -a verified/client/web/build image/web
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64 --file server/Dockerfile --target package \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label 'org.opencontainers.image.licenses=MIT' \
            --tag "$image:$GITHUB_SHA" --push --metadata-file image-metadata.json image
          digest="$(jq -er '."containerimage.digest"' image-metadata.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s@%s\n' "$image" "$digest" | tee image.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-image
          path: image.txt
          if-no-files-found: error

  macos-app:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: client/app/go.mod
          cache-dependency-path: client/app/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bash client/app/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: atrace-macos-arm64
          path: client/app/build/darwin-arm64/Atrace-macos-arm64.zip
          if-no-files-found: error
